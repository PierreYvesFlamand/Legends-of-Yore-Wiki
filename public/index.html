<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="shortcut icon" href="%PUBLIC_URL%/data/warrior.png" type="image/x-icon" />
        <title>Legends of Yore Wiki</title>
        <meta name="description" content="Fan made Legends of Yore wiki" />

        <!-- Apply the saved light/dark choice before first paint (see src/components/ThemeToggle) -->
        <script>
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        </script>

        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-QH7NT02S4N"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

          gtag('config', 'G-QH7NT02S4N');
        </script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
